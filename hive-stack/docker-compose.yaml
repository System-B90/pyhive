x-env-file: &env_file
  env_file:
    - path: .env
      required: true
    - path: .env.override
      required: false

include:
  - docker-compose-images.yaml
services:
  core:
    build:
      context: core
    image: hive/core
    container_name: hive-core
    volumes:
      - core_static:/mnt/static
      - "${HIVE_CORE_MEDIA_PATH}:/mnt/media"
      - "${HIVE_COURSE_DIRS_PATH}:/mnt/hive"
      - "${HIVE_TRASH_PATH}:/mnt/trash"
      - "${HIVE_CALENDAR_DIRS_PATH}:/mnt/calendars:ro"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    <<: *env_file
    networks:
      - hive-net
    expose:
      - 3000
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "${HIVE_MAX_DOCKER_LOG_SIZE}"

  frontend:
    container_name: hive-frontend
    hostname: hive-frontend
    build:
      context: frontend
      target: production
      args:
        # Env is not available during build
        - "HIVE_SITE_TITLE=${HIVE_SITE_TITLE}"
        - "HIVE_APPBAR_COLOR=${HIVE_APPBAR_COLOR}"
        - "HIVE_PRIMARY_COLOR=${HIVE_PRIMARY_COLOR}"
        - "HIVE_SECONDARY_COLOR=${HIVE_SECONDARY_COLOR}"
        - "HIVE_LOGO_FILENAME=${HIVE_LOGO_FILENAME}"
        - "HIVE_MAX_UPLOAD_SIZE=${HIVE_MAX_UPLOAD_SIZE}"
        - "HIVE_CHECK_IN_URL=${HIVE_CHECK_IN_URL}"
        - "HIVE_TRASH_STAFF_FS=${HIVE_TRASH_STAFF_FS}"
        - "HIVE_ENABLE_REGISTRATION=${HIVE_ENABLE_REGISTRATION}"
        - "HIVE_ENABLE_PW_CHANGE=${HIVE_ENABLE_PW_CHANGE}"
        - "HIVE_NGINX_WORKERS=${HIVE_NGINX_WORKERS}"
        - "NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/"
        - "HIVE_DAILY_REVIEW_SUBJECT_NAME=${HIVE_DAILY_REVIEW_SUBJECT_NAME}"
        - "HIVE_DAILY_REVIEW_MODULE_ORDER=${HIVE_DAILY_REVIEW_MODULE_ORDER}"
        - "HIVE_DAILY_REVIEW_MODULE_NAME=${HIVE_DAILY_REVIEW_MODULE_NAME}"
        - "HIVE_DAILY_REVIEW_TEMPLATE_EXERCISE_ORDER=${HIVE_DAILY_REVIEW_TEMPLATE_EXERCISE_ORDER}"
        - "HIVE_DAILY_REVIEW_TEMPLATE_EXERCISE_NAME=${HIVE_DAILY_REVIEW_TEMPLATE_EXERCISE_NAME}"
        - "HIVE_DAILY_REVIEW_BASE_EXERCISE_ORDER=${HIVE_DAILY_REVIEW_BASE_EXERCISE_ORDER}"
        - "HIVE_DAILY_REVIEW_BASE_EXERCISE_NAME=${HIVE_DAILY_REVIEW_BASE_EXERCISE_NAME}"
        - "HIVE_HOST_LINK_FORMAT=${HIVE_HOST_LINK_FORMAT}"
        - "HIVE_DEAR_STUDENT_DEFAULT=${HIVE_DEAR_STUDENT_DEFAULT}"
        - "HIVE_RUN_WITH_WDYR=${HIVE_RUN_WITH_WDYR}"
        - "HIVE_SCHEDULE_MODE=${HIVE_SCHEDULE_MODE}"
    image: hive/frontend
    <<: *env_file
    environment:
      - "NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/"
    volumes:
      - "${HIVE_FRONTEND_STATIC}:/frontend/public/static:ro"
    expose:
      - 2999
    networks:
      - hive-net
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "${HIVE_MAX_DOCKER_LOG_SIZE}"

  powersync:
    build: images/powersync
    image: hive/powersync
    container_name: hive-powersync
    depends_on:
      database:
        condition: service_healthy
    <<: *env_file
    networks:
      - hive-net
    expose:
      - 8080
      - 9090
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "${HIVE_MAX_DOCKER_LOG_SIZE}"

  nginx:
    build:
      context: images/nginx
    image: hive/nginx
    container_name: hive-nginx
    ports:
      - 127.0.0.1:80:80
      - 127.0.0.1:443:443
    <<: *env_file
    environment:
      - "NGINX_HOST=${HIVE_HOSTNAME_PLAIN}"
      - "NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/"
    networks:
      hive-net:
        aliases:
          - hive.org
    depends_on:
      frontend:
        condition: service_started
      core:
        condition: service_started
    volumes:
      - core_static:/mnt/core/static:ro
      - ./images/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./images/nginx/ssl.conf:/etc/nginx/templates/ssl.conf.template:ro
      - ./images/nginx/errors.conf:/etc/nginx/templates/errors.conf.template:ro
      - ./images/nginx/sites-enabled/sites.conf:/etc/nginx/templates/sites-enabled/sites.conf.template:ro
      - "${HIVE_CORE_MEDIA_PATH}:/mnt/core/media:ro"
      - "${HIVE_COURSE_DIRS_PATH}:/mnt/hive:ro"
      - "${HIVE_SSL_PATH}:/etc/nginx/ssl:ro"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "${HIVE_MAX_DOCKER_LOG_SIZE}"

networks:
  hive-net:

volumes:
  core_static:
