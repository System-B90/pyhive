location / {
    proxy_pass http://frontend:2999/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    add_header Service-Worker-Allowed /;
}

location /api/course/ {
    internal;
    proxy_buffering off;
    proxy_pass http://localhost:8081;
}

location /powersync/ {
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_read_timeout 86400;
    proxy_pass http://powersync:8080/;
}

location /api/core/metrics {
    return 403;
}

location /api/core/static/ {
    alias /mnt/core/static/;
}

location /api/core/media/ {
    internal;
    alias /mnt/core/media/;
}

location /api/core/ {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_pass http://core:3000/;
}

location /api/core/management/users/is_segel/ {
    internal;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "Bearer $cookie_token";
    proxy_redirect off;
    proxy_pass http://core:3000/management/users/is_segel/;
}

location /api/core/management/users/is_admin/ {
    internal;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "Bearer $cookie_token";
    proxy_redirect off;
    proxy_pass http://core:3000/management/users/is_admin/;
}

location /grafana/ {
    auth_request /api/core/management/users/is_segel/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_pass http://grafana:3000/;
}

location /prometheus/ {
    auth_request /api/core/management/users/is_admin/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_pass http://prometheus:9090/prometheus/;
}

location /rediscommander/ {
    auth_request /api/core/management/users/is_admin/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_pass http://rediscommander:9999/rediscommander/;
}

location /pgadmin/ {
    auth_request /api/core/management/users/is_admin/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Script-Name /pgadmin;
    proxy_set_header X-Forwarded-User "pgadmin@${NGINX_HOST}";
    proxy_redirect off;
    proxy_pass http://pgadmin:1111/;
}

location /flower/ {
    auth_request /api/core/management/users/is_admin/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_pass http://flower:5555/flower/;
}

location /cadvisor/ {
    auth_request /api/core/management/users/is_admin/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;
    proxy_pass http://cadvisor:8080/cadvisor/;
}
