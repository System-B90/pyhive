repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff
        language: system
        types: [python]
        require_serial: true
        args:
          - check
          - ./pyhive/

      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        require_serial: true
        args:
          - ./pyhive/
          - --ignore-patterns=_generated_.*\.py
        exclude: ^tests/
