name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # pyhive is pure Python and builds a single py3-none-any wheel, so the four
  # interpreters in the old matrix each produced the same artifact under the
  # same filename — which `merge-multiple: true` then collapsed back into one
  # by overwriting it three times. The "aggregation" was aggregating one wheel.
  # Build it once instead; ci.yml's compat job is what actually proves the
  # artifact works on 3.11-3.14, by installing and importing it there.
  build:
    name: Build wheel
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Ensures tags are available for versioning hooks

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling
          pip install .

      - name: Build wheel
        run: python -m build -w

      # A non-universal wheel here would mean this single build no longer
      # covers every supported interpreter — catch it before it reaches the
      # release and the pip index.
      - name: Assert the wheel is interpreter-independent
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::Expected exactly 1 wheel, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          case "${wheels[0]}" in
            *-py3-none-any.whl) echo "OK: ${wheels[0]} is a universal wheel" ;;
            *)
              echo "::error::${wheels[0]} is not py3-none-any. Publishing a single wheel is only valid while pyhive is pure Python."
              exit 1
              ;;
          esac

      - name: Upload built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish wheel
    runs-on: self-hosted
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-index:
    name: Update pip index in .github repo
    runs-on: self-hosted
    timeout-minutes: 15
    needs: publish
    steps:
      - name: Checkout pyhive
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Checkout .github index repo
        uses: actions/checkout@v7
        with:
          repository: System-B90/.github
          token: ${{ secrets.ACCESS_TOKEN }}
          path: org-github

      - name: Copy distributions and regenerate index
        run: |
          mkdir -p org-github/pypi/pyhivelms
          cp dist/* org-github/pypi/pyhivelms/
          python org-github/pypi/generate_index.py pyhivelms

      - name: Commit and push index update
        working-directory: org-github
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pypi/
          git diff --cached --quiet && exit 0
          git commit -m "Vibe-Updated pip index for pyhive ${{ github.ref_name }}"
          git push