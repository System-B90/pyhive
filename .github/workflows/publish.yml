name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build wheels matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Ensures tags are available for versioning hooks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling
          pip install .

      - name: Build wheel
        run: python -m build -w

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/*

  publish:
    name: Publish aggregated wheels
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-index:
    name: Update pip index in .github repo
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout pyhive
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checkout .github index repo
        uses: actions/checkout@v7
        with:
          repository: System-B90/.github
          token: ${{ secrets.ACCESS_TOKEN }}
          path: org-github

      - name: Copy distributions and regenerate index
        run: |
          mkdir -p org-github/pypi/pyhive
          cp dist/* org-github/pypi/pyhive/
          python org-github/pypi/generate_index.py pyhive

      - name: Commit and push index update
        working-directory: org-github
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pypi/
          git diff --cached --quiet && exit 0
          git commit -m "Vibe-Updated pip index for pyhive ${{ github.ref_name }}"
          git push