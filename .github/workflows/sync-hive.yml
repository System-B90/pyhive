name: Sync Hive Release

# Regenerates PyHive's core layer from Hive's OpenAPI spec when a new Hive
# version is released, opens a PR, and auto-merges it when the change is purely
# additive. Triggered by a repository_dispatch from Hive's release workflow, or
# manually for a specific tag.

on:
  repository_dispatch:
    types: [hive-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Hive release tag (e.g. v7.1.0). Defaults to Hive's latest release."
        required: false
        default: ""
      runner:
        description: 'Runner environment to execute on'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - github-hosted

permissions:
  contents: write
  pull-requests: write

env:
  HIVE_REPO: HiveLMS/Hive

jobs:
  sync:
    name: Sync Hive Release
    runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
    # Generating a release's spec builds its Hive backend image.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same extras as ci.yml, so the regenerated code is formatted and
          # linted by the pinned ruff rather than whatever pip resolves today.
          pip install -e ".[dev,lint,codegen]"

      - name: Resolve Hive tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.HIVE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/${HIVE_REPO}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved Hive tag: $TAG"

      # Hive's committed api/core.yaml lags its backend at some tags (v7.3.0's
      # still has integer ids), so the spec is generated from the tag's own
      # backend instead, and cached in System-B90/hive-specs with every other
      # release's, which the rebuild below needs too.
      - name: Hive specs
        id: specs
        uses: ./.github/actions/hive-specs
        with:
          hive-token: ${{ secrets.HIVE_REPO_TOKEN }}
          specs-token: ${{ secrets.HIVE_SPECS_TOKEN || secrets.ACCESS_TOKEN }}
          versions: ${{ steps.tag.outputs.version }}

      - name: Classify drift + rebuild every generation
        id: sync
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: tools
          SPECS: ${{ steps.specs.outputs.specs-dir }}
        run: |
          set -euo pipefail
          python -m hive_codegen sync \
            --spec "$SPECS/${{ steps.tag.outputs.version }}/core.yaml" \
            --version "${{ steps.tag.outputs.version }}" \
            --specs-dir "$SPECS" --repo-root . \
            --drift-out drift.md \
            --github-output "$GITHUB_OUTPUT" || true
          # Regenerate the supported-versions module from the updated hive_versions.toml.
          python scripts/generate_versions.py

      - name: Stop if no changes
        if: steps.sync.outputs.has_changes != 'true'
        run: echo "No schema changes for ${{ steps.tag.outputs.version }} — nothing to do."

      - name: Quality gates
        id: gates
        if: steps.sync.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -e
          ruff check pyhive/ tools/
          mypy pyhive/src/types/_generated/
          pytest tools/hive_codegen/tests -q
          python -c "import pyhive, pyhive.types as t; assert t.__all__"

      - name: Open / update PR
        id: pr
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.sync.outputs.api_version }}"
          BRANCH="auto/sync-hive-${VERSION}"
          git config user.name "hive-sync[bot]"
          git config user.email "hive-sync@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Sync PyHive to Hive ${VERSION}"
          git push -f origin "$BRANCH"

          BREAKING="${{ steps.sync.outputs.has_breaking }}"
          GATES="${{ steps.gates.outcome }}"
          NEW_GENERATION="${{ steps.sync.outputs.new_generation }}"
          {
            echo "Automated sync of PyHive's generated core layer to **Hive ${VERSION}**."
            echo
            if [ -n "$NEW_GENERATION" ]; then
              echo "> [!WARNING]"
              echo "> **Breaking API drift.** Hive ${VERSION} is mapped to a new generation, \`${NEW_GENERATION}\`, in \`hive_versions.toml\`,"
              echo "> not to the previous one. Give it its own backend before merging (#53): the previous generation's code does not serve it."
              echo
            fi
            cat drift.md
            echo
            echo "---"
            echo "- Quality gates: \`${GATES}\`"
            echo "- Breaking changes: \`${BREAKING}\`"
          } > pr-body.md

          if [ "$BREAKING" = "true" ] || [ "$GATES" != "success" ]; then
            LABEL="needs-manual-review"
          else
            LABEL="automerge"
          fi
          # Every label this step may add or remove must exist, or `gh pr edit`
          # fails on it.
          for name in automerge needs-manual-review; do
            gh label create "$name" --force >/dev/null 2>&1 || true
          done
          gh label create "breaking-generation" --color B60205 --force >/dev/null 2>&1 || true

          LABELS="$LABEL"
          TITLE="Sync PyHive to Hive ${VERSION}"
          if [ -n "$NEW_GENERATION" ]; then
            LABELS="${LABELS},breaking-generation"
            TITLE="${TITLE} (breaking: new generation ${NEW_GENERATION})"
          fi

          if ! PR_URL="$(gh pr create --base master --head "$BRANCH" \
            --title "$TITLE" --body-file pr-body.md --label "$LABELS" 2>/dev/null)"; then
            # Rerun against the existing PR: bring its title and labels in line
            # with this run's drift, dropping labels a previous run set.
            if [ "$LABEL" = "automerge" ]; then STALE="needs-manual-review"; else STALE="automerge"; fi
            [ -z "$NEW_GENERATION" ] && STALE="${STALE},breaking-generation"
            gh pr edit "$BRANCH" --title "$TITLE" --body-file pr-body.md \
              --add-label "$LABELS" --remove-label "$STALE"
            PR_URL="$(gh pr view "$BRANCH" --json url --jq .url)"
            # An earlier additive run may have enabled auto-merge.
            if [ "$LABEL" != "automerge" ]; then
              gh pr merge --disable-auto "$BRANCH" >/dev/null 2>&1 || true
            fi
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (additive changes only)
        if: steps.sync.outputs.has_changes == 'true' && steps.pr.outputs.label == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.pr.outputs.pr_url }}" \
            || echo "Auto-merge could not be enabled (enable it in repo settings). PR left open."

      - name: Flag for manual review (breaking or failing gates)
        if: steps.sync.outputs.has_changes == 'true' && steps.pr.outputs.label == 'needs-manual-review'
        run: |
          echo "::warning::PyHive sync to ${{ steps.sync.outputs.api_version }} needs manual review: ${{ steps.pr.outputs.pr_url }}"
