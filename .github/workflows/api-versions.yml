name: Sync API Versions

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment to execute on'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - github-hosted

jobs:
  update-readme:
    name: Update README API Versions
    runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "python"]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project (editable mode, triggers version gen via setup.py)
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Sync README
        run: python scripts/update_readme.py

      - name: Commit & Push if README changed
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync API versions in README"
            git push
          fi
